credentials:
  YOUR_PROXY_HOST_A:
    username: YOUR_USERNAME
    token: YOUR_TOKEN
    auth_base_path: /some-url/
  _:
    username: DEFAULT_USERNAME
    token: DEFAULT_TOKEN
    auth_base_path: /default-url/

listen_port: 8080

proxies:
- name: PROXY_GROUP_NAME
  hosts:
  - YOUR_PROXY_HOST_A
  - YOUR_PROXY_HOST_B
  select_policy: LATENCY # LATENCY / RANDOM / RANDOM_ON_SIMILAR_LOWEST_LATENCY
- name: PROXY_INTERNAL
  hosts:
  - YOUR_PROXY_HOST_C
  - YOUR_PROXY_HOST_D
  select_policy: RANDOM

rules:
- proxy_name: DIRECT
  domains:
  - 163.com
  - qq.com
  - cn
- proxy_name: PROXY_GROUP_NAME
  domains:
  - google.com
  - twitter.com
- proxy_name: PROXY_INTERNAL
  domains:
  - YOUR_INTERNAL_WEB.com


unmatched_policy:
  proxy_name: DIRECT
  detect: false # if proxy_name is DIRECT, this is ignored
  detect_delay_ms: 100
  detect_expires_second: 1800
  # or
  # proxy_name: PROXY_GROUP_NAME
  # detect: true # this will try with DIRECT and PROXY_GROUP_NAME
