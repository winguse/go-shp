name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]

jobs:
  # ── Go: test + build ────────────────────────────────────────────────────────
  go:
    name: Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: make clean releases

      - name: Upload Go release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: go-release-binaries
          path: |
            bin/go-shp-*.gz
            bin/go-shp-*.zip

  # ── Extension: test + build ─────────────────────────────────────────────────
  extension:
    name: Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Update extension manifest version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating extension manifest version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' manifests/manifest.chrome.json > manifests/manifest.chrome.json.tmp && mv manifests/manifest.chrome.json.tmp manifests/manifest.chrome.json
          jq --arg v "$VERSION" '.version = $v' manifests/manifest.firefox.json > manifests/manifest.firefox.json.tmp && mv manifests/manifest.firefox.json.tmp manifests/manifest.firefox.json
          jq --arg v "$VERSION" '.version = $v' manifests/manifest.edge.json > manifests/manifest.edge.json.tmp && mv manifests/manifest.edge.json.tmp manifests/manifest.edge.json
        working-directory: extension

      - name: Build Chrome, Firefox & Edge extensions
        run: npm run build
        working-directory: extension

      - name: Archive Chrome extension
        run: |
          cd extension/dist/chrome
          zip -r ../../go-shp-chrome-extension.zip .

      - name: Archive Firefox extension
        run: |
          cd extension/dist/firefox
          zip -r ../../go-shp-firefox-extension.zip .

      - name: Archive Edge extension
        run: |
          cd extension/dist/edge
          zip -r ../../go-shp-edge-extension.zip .

      - name: Upload Chrome extension artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: go-shp-chrome-extension
          path: extension/go-shp-chrome-extension.zip

      - name: Upload Firefox extension artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: go-shp-firefox-extension
          path: extension/go-shp-firefox-extension.zip

      - name: Upload Edge extension artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: go-shp-edge-extension
          path: extension/go-shp-edge-extension.zip

  # ── Release: publish to GitHub Releases (tags only) ─────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [go, extension]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Go binaries
        uses: actions/download-artifact@v8
        with:
          name: go-release-binaries
          path: bin/

      - name: Download Chrome extension
        uses: actions/download-artifact@v8
        with:
          name: go-shp-chrome-extension
          path: extension/

      - name: Download Firefox extension
        uses: actions/download-artifact@v8
        with:
          name: go-shp-firefox-extension
          path: extension/

      - name: Download Edge extension
        uses: actions/download-artifact@v8
        with:
          name: go-shp-edge-extension
          path: extension/

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            bin/go-shp-*.gz
            bin/go-shp-*.zip
            extension/go-shp-chrome-extension.zip
            extension/go-shp-firefox-extension.zip
            extension/go-shp-edge-extension.zip

  # ── Docker: concurrent platform builds, push to ghcr.io on tags only ─────────
  docker-amd64:
    name: Docker Build (amd64)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [go]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  docker-arm64:
    name: Docker Build (arm64)
    runs-on: ubuntu-24.04-arm
    if: startsWith(github.ref, 'refs/tags/')
    needs: [go]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  docker-merge:
    name: Docker Merge Manifest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ghcr.io/${{ github.repository }}@${{ needs.docker-amd64.outputs.digest }} \
            ghcr.io/${{ github.repository }}@${{ needs.docker-arm64.outputs.digest }}

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
